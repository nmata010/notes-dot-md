<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>notes dot md</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23fcfcfb'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23101010'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
  <header>
    <div class="header-left">
      <div class="brand-row">
        <div>
          <h1 class="wordmark">notes d<span class="wordmark-dot" aria-hidden="true"></span>t md</h1>
          <div id="filePath" class="file-path"></div>
        </div>
      </div>
      <div class="view-toggle" id="taskViewToggle">
        <button id="boardViewBtn" class="active">Board</button>
        <button id="listViewBtn">List</button>
      </div>
    </div>
    <div class="buttons">
      <button id="setupBtn" title="Setup" style="display: none;">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M6.9 1.7a1.1 1.1 0 0 1 2.2 0l.15.9a.7.7 0 0 0 .46.5.7.7 0 0 0 .67-.1l.72-.56a1.1 1.1 0 0 1 1.56 1.56l-.57.72a.7.7 0 0 0-.09.67.7.7 0 0 0 .5.46l.9.15a1.1 1.1 0 0 1 0 2.2l-.9.15a.7.7 0 0 0-.5.46.7.7 0 0 0 .1.67l.56.72a1.1 1.1 0 0 1-1.56 1.56l-.72-.57a.7.7 0 0 0-.67-.09.7.7 0 0 0-.46.5l-.15.9a1.1 1.1 0 0 1-2.2 0l-.15-.9a.7.7 0 0 0-.46-.5.7.7 0 0 0-.67.1l-.72.56a1.1 1.1 0 0 1-1.56-1.56l.57-.72a.7.7 0 0 0 .09-.67.7.7 0 0 0-.5-.46l-.9-.15a1.1 1.1 0 0 1 0-2.2l.9-.15a.7.7 0 0 0 .5-.46.7.7 0 0 0-.1-.67l-.56-.72a1.1 1.1 0 0 1 1.56-1.56l.72.57a.7.7 0 0 0 .67.09.7.7 0 0 0 .46-.5l.15-.9z" stroke="currentColor" stroke-width="1.2"/><circle cx="8" cy="8" r="2" stroke="currentColor" stroke-width="1.2"/></svg>
      </button>
      <button id="newTaskBtn">New File</button>
      <button id="openTaskBtn">Select File</button>
      <button id="saveBtn" class="primary" disabled style="display: none;">Save</button>
    </div>
  </header>

  <div id="filterBar" class="filter-bar" style="display: none;">
    <div class="filter-search-row">
      <svg width="14" height="14" viewBox="0 0 16 16" fill="none" style="flex-shrink: 0; color: var(--text-muted);"><circle cx="6.5" cy="6.5" r="5" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 10.5L14 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <input type="text" id="filterSearchInput" placeholder="Filter tasks..." />
      <button id="copyFilteredBtn" title="Copy visible tasks as markdown" style="background: none; border: none; padding: 4px; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; flex-shrink: 0; transition: color 0.15s ease;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
      </button>
    </div>
    <div class="filter-pills" id="filterPills"></div>
  </div>

  <!-- TASKS TAB PANEL -->
  <div class="tab-panel active" id="tasksPanel">
    <div class="list-view" id="listView" style="display: none;"></div>
    <div class="board" id="board">
      <div class="empty-state" id="boardEmptyState" style="width: 100%;">
        <p style="margin-bottom: 24px; font-size: 18px; font-weight: 600; color: var(--text-primary);">Create or select a markdown file</p>
        <div class="empty-actions">
          <button id="newBtnLarge">New Markdown</button>
          <button id="openBtnLarge">Select Markdown</button>
          <button id="reopenTaskBtn" class="secondary" style="display: none;">Reopen Last File</button>
        </div>
        <p class="empty-hint" id="browserSupportHint"></p>
      </div>
    </div>
  </div>

  <!-- MODAL -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modalTitle">Edit</h3>
        <button class="modal-close" id="modalClose">&times;</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-footer">
        <button id="modalCancel">Cancel</button>
      </div>
    </div>
  </div>

  <div class="status-bar" id="status"></div>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
