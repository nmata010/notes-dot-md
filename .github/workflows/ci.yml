name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - staging

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run checks
        run: npm test
